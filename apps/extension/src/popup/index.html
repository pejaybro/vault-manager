<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vault Manager</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0f0f12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      background: #1a1a22;
      border: 1px solid #2a2a36;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .btn {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🔐</span>
    <span class="title">Vault Manager</span>
  </div>
  <input type="text" class="input" placeholder="Search passwords..." id="search" />
  <button class="btn" id="autofill-btn">Auto-Fill Current Page</button>
  <div class="status">Connected to Desktop Vault</div>

  <script>
    document.getElementById('autofill-btn').addEventListener('click', () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        if (tabs[0]?.url) {
          const domain = new URL(tabs[0].url).hostname;
          chrome.runtime.sendMessage({ action: 'REQUEST_AUTOFILL', domain });
        }
      });
    });
  </script>
</body>
</html>
